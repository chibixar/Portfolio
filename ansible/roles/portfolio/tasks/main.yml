---
# System
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - git
      - openssl
    state: present

# Docker
- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: true

# App directories 
- name: Create app directory
  file:
    path: /opt/portfolio
    state: directory
    mode: "0755"

- name: Create nginx config directory
  file:
    path: /opt/portfolio/nginx/conf
    state: directory
    mode: "0755"

- name: Create certbot www directory
  file:
    path: /opt/portfolio/certbot/www
    state: directory
    mode: "0755"

- name: Create certbot conf directory
  file:
    path: /opt/portfolio/certbot/conf
    state: directory
    mode: "0755"

# Check which certs already exist 
- name: Check if real cert exists for combined domains
  shell: |
    openssl x509 -in /opt/portfolio/certbot/conf/live/{{ domain }}/fullchain.pem \
      -noout -issuer 2>/dev/null | grep -q "Let's Encrypt"
  register: real_cert
  failed_when: false
  changed_when: false

# Dummy certs only if real ones don't exist
- name: Create dummy cert directory
  file:
    path: /opt/portfolio/certbot/conf/live/{{ domain }}
    state: directory
    mode: "0755"
  when: real_cert.rc != 0

- name: Generate dummy cert
  shell: |
    openssl req -x509 -nodes -newkey rsa:2048 \
      -keyout /opt/portfolio/certbot/conf/live/{{ domain }}/privkey.pem \
      -out /opt/portfolio/certbot/conf/live/{{ domain }}/fullchain.pem \
      -days 1 -subj "/CN={{ domain }}"
  when: real_cert.rc != 0

# Copy files
- name: Copy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /opt/portfolio/docker-compose.yml

- name: Copy nginx config
  template:
    src: default.conf.j2
    dest: /opt/portfolio/nginx/conf/default.conf

# Pull and start
- name: Pull latest image from GHCR
  community.docker.docker_image:
    name: "{{ ghcr_image }}"
    source: pull

- name: Start containers
  community.docker.docker_compose_v2:
    project_src: /opt/portfolio
    state: present

# Wait for Nginx to bind to port 80 safely 
- name: Wait for Nginx to be ready on port 80
  wait_for:
    port: 80
    delay: 5
    timeout: 60
  when: real_cert.rc != 0

- name: Remove dummy certs so Certbot can create real ones cleanly
  file:
    path: "/opt/portfolio/certbot/conf/live/{{ domain }}"
    state: absent
  when: real_cert.rc != 0

# (Ensure this remains `command:` and not the module to prevent tearing down Nginx)
- name: Stop certbot renewal container before issuing certs
  command: docker compose stop certbot
  args:
    chdir: /opt/portfolio
  when: real_cert.rc != 0

- name: Issue real cert for combined domains (Bypass Rate Limit)
  command: >
    docker run --rm
    -v /opt/portfolio/certbot/www:/var/www/certbot
    -v /opt/portfolio/certbot/conf:/etc/letsencrypt
    certbot/certbot certonly
    --webroot
    --webroot-path=/var/www/certbot
    --email {{ email }}
    --agree-tos
    --no-eff-email
    --non-interactive
    --force-renewal
    -d {{ domain }} -d status.{{ domain }}
  when: real_cert.rc != 0

# Restart certbot and reload nginx
- name: Start all containers
  community.docker.docker_compose_v2:
    project_src: /opt/portfolio
    state: present

- name: Restart nginx to load real certs completely
  command: docker compose restart nginx
  args:
    chdir: /opt/portfolio
  when: real_cert.rc != 0