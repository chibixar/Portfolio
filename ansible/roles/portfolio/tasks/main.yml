---
# ── System
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - git
      - openssl
    state: present

# ── Docker 
- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: true

# ── App directories 
- name: Create app directory
  file:
    path: /opt/portfolio
    state: directory
    mode: "0755"

- name: Create nginx config directory
  file:
    path: /opt/portfolio/nginx/conf
    state: directory
    mode: "0755"

- name: Create certbot directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/portfolio/certbot/www
    - /opt/portfolio/certbot/conf/live/{{ domain }}

# ── Dummy cert so nginx can start before real cert exists
- name: Check if real cert already exists
  stat:
    path: /opt/portfolio/certbot/conf/live/{{ domain }}/fullchain.pem
  register: real_cert

- name: Generate dummy self-signed certificate
  shell: |
    openssl req -x509 -nodes -newkey rsa:2048 \
      -keyout /opt/portfolio/certbot/conf/live/{{ domain }}/privkey.pem \
      -out /opt/portfolio/certbot/conf/live/{{ domain }}/fullchain.pem \
      -days 1 \
      -subj "/CN={{ domain }}"
  when: not real_cert.stat.exists

# ── Copy files
- name: Copy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /opt/portfolio/docker-compose.yml

- name: Copy nginx config with domain substituted
  template:
    src: default.conf.j2
    dest: /opt/portfolio/nginx/conf/default.conf

# ── Pull and start
- name: Pull latest image from GHCR
  community.docker.docker_image:
    name: "{{ ghcr_image }}"
    source: pull

- name: Start containers
  community.docker.docker_compose_v2:
    project_src: /opt/portfolio
    state: present

# ── Issue real SSL cert
- name: Issue SSL certificate via certbot
  command: >
    docker compose run --rm certbot certbot certonly
    --webroot
    --webroot-path=/var/www/certbot
    --email {{ email }}
    --agree-tos
    --no-eff-email
    --non-interactive
    -d {{ domain }}
  args:
    chdir: /opt/portfolio
  when: not real_cert.stat.exists
  register: certbot_result
  changed_when: "'Successfully received certificate' in certbot_result.stdout"

# ── Reload nginx with real cert
- name: Reload nginx after cert is issued
  command: docker compose exec nginx nginx -s reload
  args:
    chdir: /opt/portfolio
  when: not real_cert.stat.exists