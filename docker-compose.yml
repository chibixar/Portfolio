services:
  nginx:
    build: .                          # builds Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d          # nginx config
      - ./certbot/www:/var/www/certbot          # certbot challenge files
      - ./certbot/conf:/etc/letsencrypt         # certificates
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot          # certbot writes challenge files here
      - ./certbot/conf:/etc/letsencrypt         # certbot writes certs here
    entrypoint: >
      /bin/sh -c "trap exit TERM;          
      while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped